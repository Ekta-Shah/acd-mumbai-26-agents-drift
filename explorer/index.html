  var h=location.hash.replace(/^#/,""),o={};

}
function togglePlay(){
  if(S.timer){stop()}else{if(S.day>=30)S.day=1;S.timer=setInterval(function(){if(S.day>=30){stop()}else{S.day++}update()},260)}
  var b=$("play");if(b)b.textContent=(S.timer?"Pause":"Play")+" (space)";
}
function scene(){
  tabs();var m=$("main");
  if(S.scene==="green"){
    m.innerHTML='<h2>Latency, errors and cost stayed flat <span class="ok">OK</span></h2><div class="row" id="gp"></div><div id="hid"></div>'+scrub();
    bindScrub();
  }else if(S.scene==="catch"){
    m.innerHTML='<h2>The drift score rose while the dashboard stayed green</h2><div class="panel" id="cp"></div><div class="panel" id="tr" style="margin-top:10px;min-height:236px"></div>'+scrub();
    bindScrub();
  }else if(S.scene==="fix"){
    m.innerHTML='<h2 id="fh">Switch the patterns on one at a time</h2><div class="row"><div class="panel" id="fp" style="flex:1"></div></div><div class="ctl" id="sw"></div><div class="hint">Keys 1 to 4 toggle the patterns. R resets.</div>';
  }else if(S.scene==="retention"){
    m.innerHTML='<h2>Constraints that survive n handoffs: p to the power n</h2><div class="panel" id="rp"></div><div class="ctl"><label for="pr">Kept per handoff <b id="prv"></b>%</label><input type="range" id="pr" min="80" max="100" value="'+S.pr+'"><label for="nn">Handoffs <b id="nv"></b></label><input type="range" id="nn" min="1" max="6" value="'+S.n+'"></div><div class="big" id="rd" style="margin-top:8px"></div>';
    $("pr").oninput=function(){S.pr=+this.value;update()};$("nn").oninput=function(){S.n=+this.value;update()};
  }else{
    m.innerHTML='<h2>What it cost and what it bought</h2><div class="panel" id="rs"></div><div class="ctl"><button class="btn" id="tg"></button><span class="hint">Click to compare before and after.</span></div>';
    $("tg").onclick=function(){S.after=!S.after;update()};
  }
  update();
}
function update(){
  writeHash();
  var sc=S.scene,d=D.daily[S.day-1];
  if(sc==="green"){
    var M=[["p95 latency","s",function(x){return x.p95_latency_s},0,3,[0,1,2,3],function(v){return v+" s"}],["Error rate","%",function(x){return x.error_rate_pct},0,1,[0,0.5,1],function(v){return v+"%"}],["Cost per ticket","$",function(x){return x.cost_usd_per_ticket},0,0.02,[0,0.01,0.02],function(v){return"$"+v}]];
    $("gp").innerHTML=M.map(function(c,i){return'<div class="panel" style="width:402px"><b>'+c[0]+'</b> <span class="ok">OK '+(i==0?d.p95_latency_s+" s":i==1?d.error_rate_pct+"%":"$"+d.cost_usd_per_ticket)+'</span>'+chart({w:374,h:290,right:20,x0:1,x1:30,y0:c[3],y1:c[4],xt:[1,10,20,30],yt:c[5],yf:c[6],cursor:S.day,series:[{pts:days(c[2],S.day),color:"#3DD68C",w:5}]})+'</div>'}).join("");
    $("hid").innerHTML=S.reveal?'<div class="panel" style="margin-top:10px"><span class="drift">Sent to human: '+d.sent_to_human+' of '+d.high_value_tickets+'</span> <span class="sec">on day '+S.day+'. The dashboard never showed this.</span></div>':'<div style="margin-top:10px"><button class="btn" id="rv">Show the panel the dashboard did not have (H)</button></div>';
    if($("rv"))$("rv").onclick=function(){S.reveal=true;update()};
    $("dayv").textContent=S.day;$("day").value=S.day;
  }else if(sc==="catch"){
    var mk=D.events.map(function(e){return{day:e.day,y:D.daily[e.day-1].drift_score_pct,label:"Day "+e.day+": "+e.title,sel:S.ev===e.day}});
    var YA=yax(D.daily.map(function(x){return x.drift_score_pct}));$("cp").innerHTML=chart({w:1210,h:290,right:150,x0:1,x1:30,y0:0,y1:YA.y1,xt:[1,5,9,14,20,24,30],yt:YA.yt,yf:function(v){return v+"%"},cursor:S.day,hline:D.meta.alarm_threshold_pct,hlabel:"alarm "+D.meta.alarm_threshold_pct+"%",marks:mk,series:[{pts:days(function(x){return x.drift_score_pct},30),color:"#FFB020",w:5,label:"drift score"}]});
    Array.prototype.forEach.call(document.querySelectorAll(".mk"),function(g){g.onclick=function(){S.ev=+g.getAttribute("data-day");S.day=S.ev;update()}});
    var t='<span class="drift">Day '+S.day+': drift score '+d.drift_score_pct+'%, '+d.golden_mismatch+' of '+D.meta.golden_set_size+' golden cases differ</span> <span class="ok">latency '+d.p95_latency_s+' s, errors '+d.error_rate_pct+'%: OK</span>';
    var ev=D.events.filter(function(e){return e.day===S.ev})[0];
    if(ev){t+='<div style="margin:8px 0 4px"><b>'+esc(ev.title)+'</b> <span class="sec">('+esc(ev.example)+')</span></div>';
      t+=ev.trace.map(function(l,i){return'<div class="mono line'+(i===ev.break_line?' br':'')+'">'+esc(l)+(i===ev.break_line?'   <span class="drift"> BREAK POINT</span>':'')+'</div>'}).join("")}
    else t+='<div class="hint" style="margin-top:10px">Click a marker on the line to open its trace and see the break point.</div>';
    $("tr").innerHTML=t;$("dayv").textContent=S.day;$("day").value=S.day;
  }else if(sc==="fix"){
    var run=D.runs[S.p],ref=D.runs["0000"],ser=[{pts:ref.map(function(v,i){return[i+1,v]}),color:"#FFB020",w:3,dash:"8 7",op:.55,label:"no fixes",dy:-8}];
    if(run)ser.push({pts:run.map(function(v,i){return[i+1,v]}),color:"#FFB020",w:6,label:S.p==="0000"?"":"selected",dy:18});
    var YB=yax(ref);$("fp").innerHTML=chart({w:1180,h:350,right:130,x0:1,x1:30,y0:0,y1:YB.y1,xt:[1,5,9,14,20,24,30],yt:YB.yt,yf:function(v){return v+"%"},hline:D.meta.alarm_threshold_pct,hlabel:"alarm "+D.meta.alarm_threshold_pct+"%",series:ser});
    $("sw").innerHTML=PAT.map(function(n,i){var on=S.p[i]==="1";return'<button class="btn'+(on?' on':'')+'" data-i="'+i+'">'+(i+1)+'  '+n+': <b>'+(on?"ON":"OFF")+'</b></button>'}).join("");
    Array.prototype.forEach.call($("sw").children,function(b){b.onclick=function(){tog(+b.getAttribute("data-i"))}});
    $("fh").innerHTML=run?('Day 30 drift score: <span class="drift">'+run[29]+'%</span> <span class="sec">(peak '+Math.max.apply(null,run)+'%)</span>'):'<span class="sec">No run for this combination ('+S.p+'). Try another switch.</span>';
  }else if(sc==="retention"){
    var cs=function(p){var r=[];for(var k=1;k<=6;k++)r.push([k,100*Math.pow(p/100,k)]);return r};
    var p2=Math.max(S.pr-5,50);
    $("rp").innerHTML=chart({w:1180,h:340,right:150,x0:1,x1:6,y0:0,y1:100,xt:[1,2,3,4,5,6],yt:[0,25,50,75,100],yf:function(v){return v+"%"},series:[{pts:cs(S.pr),color:"#F2F4F7",w:6,label:"p = "+S.pr+"%"},{pts:cs(p2),color:"#9AA4B2",w:6,dash:"10 6",label:"p = "+p2+"%",dy:20}]});
    $("prv").textContent=S.pr;$("nv").textContent=S.n;
    $("rd").innerHTML='At p = '+S.pr+'%, after '+S.n+' handoffs <span style="color:#F2F4F7">'+(100*Math.pow(S.pr/100,S.n)).toFixed(0)+'%</span> of the constraints survive.';
  }else{
    var a=D.summary.no_fixes,b=D.summary.all_fixes;
    var rows=[["Above limit refunds approved without a human",a.above_limit_approved_without_human,b.above_limit_approved_without_human,function(v){return v>0?'<span class="breach">'+v+' BREACH</span>':'<span class="ok">'+v+' OK</span>'}],
      ["p95 latency",a.p95_latency_s,b.p95_latency_s,function(v){return v+" s"}],
      ["Cost per ticket",a.cost_usd_per_ticket,b.cost_usd_per_ticket,function(v){return"$"+v.toFixed(3)}],
      ["Replay cost per day, "+D.meta.golden_set_size+" golden cases",a.replay_cost_usd_per_day,b.replay_cost_usd_per_day,function(v){return v?"about $"+v.toFixed(2):"none"}],
      ["Drift score on day 30",a.final_drift_score_pct,b.final_drift_score_pct,function(v){return'<span class="drift">'+v+'%</span>'}]];
    $("rs").innerHTML='<table><tr><th>Days 1 to 30</th><th>No fixes'+(S.after?'':' (shown)')+'</th><th>All four patterns'+(S.after?' (shown)':'')+'</th></tr>'+rows.map(function(r){return'<tr><td>'+r[0]+'</td><td style="opacity:'+(S.after?.45:1)+'">'+r[3](r[1])+'</td><td style="opacity:'+(S.after?1:.45)+'">'+r[3](r[2])+'</td></tr>'}).join("")+'</table><div class="hint">The fixes cost about $'+(b.cost_usd_per_ticket-a.cost_usd_per_ticket).toFixed(3)+' more per ticket and '+(b.p95_latency_s-a.p95_latency_s).toFixed(1)+' s more latency.</div>';
    $("tg").textContent=S.after?"Showing: after (click for before)":"Showing: before (click for after)";
  }
}
function tog(i){var a=S.p.split("");a[i]=a[i]==="1"?"0":"1";S.p=a.join("");update()}
document.addEventListener("keydown",function(e){
  if(e.target&&e.target.tagName==="INPUT"&&(e.key==="ArrowLeft"||e.key==="ArrowRight")&&e.target.type!=="range")return;
  var k=e.key;
  if(k==="ArrowLeft"||k==="ArrowRight"){if(S.scene==="green"||S.scene==="catch"){S.day=Math.min(30,Math.max(1,S.day+(k==="ArrowRight"?1:-1)));update();e.preventDefault()}}
  else if(k===" "){if(S.scene==="green"||S.scene==="catch"){togglePlay();e.preventDefault()}}
  else if(k>="1"&&k<="4"&&S.scene==="fix"){tog(+k-1)}
  else if(k==="r"||k==="R"){stop();S.day=S.scene==="catch"?1:30;S.p="0000";S.pr=95;S.n=3;S.ev=null;S.reveal=false;S.after=false;scene()}
  else if((k==="h"||k==="H")&&S.scene==="green"){S.reveal=true;update()}
});
window.addEventListener("hashchange",function(){parseHash();scene()});
function boot(){D=JSON.parse($("embedded").textContent);start()}
function start(){parseHash();scene()}
/* Read data/results.json when the page is served over a server. From a double click (file), the fetch is refused and the embedded copy is used. */
try{fetch("../data/results.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){D=j;start()}).catch(function(){})}catch(e){}
boot();
})();
</script>
